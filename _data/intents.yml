# ---------------------------------------------------------------------------
# Intent chips for the "Where to go next" panel.
#
# One tap instead of typing. Written in the reader's own voice — the same
# register as the question bubbles on the front page — because the reader this
# site is built for often cannot name their problem in search terms. That is
# the whole premise of the book.
#
# Rules of thumb when editing:
#   - first person, plain words, the way someone would actually say it
#   - a need, not a topic ("I'm behind on payments", not "Debt management")
#   - six per topic, and each one must narrow to something. A chip that
#     returns the whole list has taught the reader the chips do not work.
#   - `query` is keyword soup fed to the ranking engine. It is never shown,
#     so stuff it with every term that should match. If a chip returns
#     nothing useful, fix it here or add `keywords` to the resource in
#     _data/resources.yml — do not reword the label to suit the data.
#
# Keys must match pillar filenames. A topic with no entry here simply renders
# the search box without chips.
# ---------------------------------------------------------------------------

debt-borrowing:
  - label: I'm behind on payments
    query: credit card collections behind payments creditor bankruptcy
  - label: I want a plan to get out
    query: payoff calculator plan budget coaching
  - label: I want to talk to someone
    query: counselling counsellors coaching talk someone help
  - label: I'm not in the US
    query: country charity outside local
  - label: I'd rather work through it with others
    query: small group course study together
  - label: Just show me the passages
    query: verses passages scripture reference lookup

