# ---------------------------------------------------------------------------
# Stewardship Journeys — site configuration
# All homepage copy lives here or in the _pillars collection. Templates in
# _layouts/ and _includes/ read from this file; none of it is hard-coded.
#
# Copy is adapted from "Financial Freedom Through Godly Stewardship"
# by Rowan Rivers. Section references are noted beside each block.
# ---------------------------------------------------------------------------

title: Stewardship Journeys
tagline: Money questions, answered from Scripture
description: >-
  Plain answers to the money questions Christians actually ask, drawn from
  Scripture, with the passages shown and the disagreements named honestly.

url: "https://stewardshipjourneys.com"
# Serving as a GitHub Pages *project* site (username.github.io/stewardship-blog)
# requires the baseurl below. Clear it to "" when the custom domain is attached.
baseurl: "/stewardship-blog"

lang: en

collections:
  pillars:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: pillars
    values:
      layout: pillar

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

# ---------------------------------------------------------------------------
# Masthead
# ---------------------------------------------------------------------------
nav:
  # Topic links are generated from the _pillars collection.
  # Anything listed here is appended after them.
  extra:
    - title: About
      url: /about/

# ---------------------------------------------------------------------------
# Hero — leads with the reader's felt problem, not the site's mission.
# Questions are from the book's Introduction.
# ---------------------------------------------------------------------------
hero:
  label: Biblical wisdom · practical money
  # Inline HTML is allowed in these strings; <em> renders in the brass accent.
  heading: The money questions you don't ask out loud at church.
  body: >-
    How do I find financial freedom without losing my soul? How do I escape
    debt, anxiety, and the feeling that there is never enough? Can I honour God
    with my money and still meet my needs?
  # Short, plain-language promise. Keep it to one line.
  promise: >-
    Every answer here starts with the answer — then the passages it rests on,
    then an honest note on <em>where believers disagree</em>.
  cta_text: Start with your question
  cta_url: "#ledger"
  # Small trust line under the buttons.
  trust: Free to read · No sign-in · Scripture cited on every page

# ---------------------------------------------------------------------------
# Mindsets — the self-identification section. Adapted from the Introduction,
# "Money Is Not Just a Financial Issue -- It's a Spiritual One".
# This sits directly under the hero so a reader meets their own problem first.
# ---------------------------------------------------------------------------
mindsets:
  heading: Which one sounds like you?
  sub: >-
    Most money struggles are not arithmetic. They are one of three beliefs,
    absorbed so quietly you may never have said them out loud.
  items:
    - name: Scarcity
      claim: "There will not be enough."
      body: >-
        You hold tight, share little, and treat other people's success as a
        threat to your own slice. The pie always looks fixed.
      icon: icon-scarcity.svg
      url: /budgeting-saving/
    - name: Self-reliance
      claim: "It all depends on me."
      body: >-
        You carry your family's whole future on your shoulders, paralysed by
        the fear of one wrong move. You are exhausted — not from working hard,
        but from carrying what was never yours alone.
      icon: icon-self-reliance.svg
      url: /anxiety-provision/
    - name: Shame
      claim: "Wanting more must be unspiritual."
      body: >-
        You treat your ambition like a secret sin, certain that real Christians
        only care about higher things. So you keep the engine running and the
        car in the garage.
      icon: icon-shame.svg
      url: /wealth-prosperity/

# ---------------------------------------------------------------------------
# Question ledger
# ---------------------------------------------------------------------------
ledger:
  heading: Start with what you came for
  sub: Six questions people ask most. Each opens to a full answer.
  questions:
    - ref: 1 Timothy 6:10
      question: Is money the root of all evil?
      url: /tithing-giving/
    - ref: 2 Corinthians 8:12
      question: Can I stop tithing while I pay off debt?
      url: /tithing-giving/
    - ref: Proverbs 3:9
      question: Do I tithe on gross or net income?
      url: /tithing-giving/
    - ref: Proverbs 22:7
      question: Is it a sin to be in debt?
      url: /debt-borrowing/
    - ref: Proverbs 6:6–8
      question: Is saving money a lack of faith?
      url: /budgeting-saving/
    - ref: Philippians 4:6
      question: Is it a sin to worry about money?
      url: /anxiety-provision/

# The "how every answer is built" explainer beneath the ledger
howto:
  label: How every answer is built
  demo_label: Short answer
  demo: >-
    No. The verse people are remembering is 1 Timothy 6:10, and it says the
    <em>love</em> of money is <em>a</em> root of <em>all kinds</em> of evil.
  note: >-
    The answer comes first, in full, before any explanation — so you get what
    you needed in ten seconds, and so search engines and AI assistants can
    quote it accurately.

# ---------------------------------------------------------------------------
# The three-step journey — the book's spine, used here as a visual anchor.
# ---------------------------------------------------------------------------
journey:
  label: The path these answers sit on
  heading: Freedom is built from the inside out.
  sub: >-
    Every answer on this site belongs somewhere on a three-step path. Knowing
    which step you are standing on usually matters more than the individual
    question.
  steps:
    - name: Align Your Heart
      theme: Identity &amp; surrender
      body: >-
        See God as your Provider, not your paycheck. Reframe what you believe
        about money before you touch a spreadsheet.
    - name: Apply God's Wisdom
      theme: Discipline &amp; strategy
      body: >-
        Budgeting, saving, giving, investing — the practical disciplines, each
        rooted in Scripture rather than in a guru's system.
    - name: Build for Eternity
      theme: Purpose &amp; legacy
      body: >-
        Live with purpose and make an impact that outlives your bank account.

# ---------------------------------------------------------------------------
# Author story — the strongest trust signal on the page. Quoted from the
# book's Preface. Specificity is what makes this work; do not smooth it out.
# ---------------------------------------------------------------------------
story:
  label: Why trust these answers
  # The opening line of the Preface, quoted.
  pull_quote: >-
    I once lost almost everything: my legs, my left eye, my house, ninety
    percent of my savings, my career, my marriage.
  body: >-
    A single leveraged investment, driven by greed, took ninety percent of what
    I had saved. What changed my life afterwards was not a smarter financial
    plan or a new income stream. It was surrender.
  attribution: Rowan Rivers
  attribution_role: Author, Financial Freedom Through Godly Stewardship
  cta_text: Read the whole story
  cta_url: /about/
  # Drop a portrait at assets/img/ and put the filename here, e.g.
  # portrait: /assets/img/rowan-rivers.jpg
  # While this is empty a monogram placeholder renders instead.
  portrait: ""
  portrait_alt: ""

# ---------------------------------------------------------------------------
# Topic grid heading (the six cards come from _pillars)
# ---------------------------------------------------------------------------
topics:
  heading: Six topics
  sub: Every question on the site lives in one of these.

# ---------------------------------------------------------------------------
# Book panel
# ---------------------------------------------------------------------------
book:
  cover_title: |-
    Financial Freedom
    Through
    Godly Stewardship
  heading: These pages answer one question. The book walks the whole path.
  body: >-
    Three steps, twelve chapters, with reflection questions and a devotional
    prayer at the end of each. 181 pages, paperback and Kindle.
  cta_text: About the book
  cta_url: /book/

# ---------------------------------------------------------------------------
# Email capture
# ---------------------------------------------------------------------------
capture:
  heading: The Stewardship Scripture Index
  body: >-
    Every passage on money in Scripture, sorted by what you're facing — debt,
    giving, worry, provision, work. Free, one page, no sign-in to read it.
  placeholder: you@example.com
  button: Send me the index
  # Paste the form endpoint from your email provider here. While it is blank
  # the form renders disabled rather than posting nowhere.
  action: ""

# ---------------------------------------------------------------------------
# Footer
# ---------------------------------------------------------------------------
author: Rowan Rivers
footer_notes:
  - Written by Rowan Rivers, author of <em>Financial Freedom Through Godly Stewardship</em>.
  - Scripture quotations are from the World English Bible, which is in the public domain.
  - >-
    This site explains what Scripture says about money. It is not financial,
    legal, or tax advice, and it is not a substitute for a licensed
    professional who knows your situation.

# ---------------------------------------------------------------------------
# Sign-in page (/login/)
#
# Deliberately passwordless and email-only. The audience for this site is
# shame-sensitive about money (see the book's Introduction), so social sign-in
# buttons read as exposure and are omitted on purpose. One field, one button,
# and an explicit privacy promise.
#
# `action` must point at a magic-link / passwordless provider endpoint. While
# it is blank the form renders disabled rather than collecting an address that
# goes nowhere. GitHub Pages is static and cannot authenticate on its own.
# ---------------------------------------------------------------------------
login:
  heading: Welcome back.
  sub: >-
    Enter your email and we'll send you a sign-in link. No password to
    remember, and nothing new to create.
  placeholder: you@example.com
  button: Email me a sign-in link
  # Shown under the button. This is the most important line on the page.
  privacy: >-
    Your email is only ever used to sign you in. We never show your name, your
    questions, or your notes to anyone — not to your church, not to advertisers,
    not to another reader.
  behind_heading: What's behind the door
  behind:
    - Your Stewardship Notes — reflections, commitments and answered prayers, private to you
    - The Stewardship Scripture Index, saved where you can find it again
    - Any answer you've marked to come back to
  scripture: The earth is the LORD's, with its fullness.
  scripture_ref: Psalm 24:1
  help_text: Trouble signing in?
  help_url: /about/
  action: ""
