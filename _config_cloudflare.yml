# Layered on top of _config.yml by the Cloudflare build command:
#   bundle install && bundle exec jekyll build --config _config.yml,_config_cloudflare.yml
#
# Now that GitHub Pages is retired, _config.yml already sets baseurl to "" and
# this override is redundant. It is kept because the build command in the
# Cloudflare dashboard names this file — deleting it would break the build.
# To remove it, first change that build command to a plain `jekyll build`.
baseurl: ""
