<section class="hero">
  <div class="wrap hero__in">
    <div>
      <p class="label">{{ site.hero.label }}</p>
      <h1>{{ site.hero.heading }}</h1>
      <p class="hero__body">{{ site.hero.body }}</p>
      <p class="hero__promise">{{ site.hero.promise }}</p>
      <p class="hero__actions">
        <a class="btn" href="{{ site.hero.cta_url }}">{{ site.hero.cta_text }}</a>
      </p>
      <p class="hero__trust">{{ site.hero.trust }}</p>
    </div>
    <div class="treewrap">
      {% include tree.svg %}
    </div>
  </div>
</section>
